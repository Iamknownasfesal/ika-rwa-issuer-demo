[workspace]
resolver = "2"
members = ["programs/issuer-ledger"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause-Clear"
repository = "https://github.com/dwallet-labs/ika-rwa-issuer-demo"

[workspace.dependencies]
# On-chain (Pinocchio, latest)
pinocchio = { version = "0.11.2", features = ["cpi"] }
pinocchio-system = "0.6.1"
pinocchio-token-2022 = "0.4.0"
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }

# Testing
litesvm = "0.16.0"
solana-account = "4.3.0"
solana-address = { version = "2.6", features = ["curve25519"] }
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = "4.1"
solana-program-error = "3.0"
solana-clock = { version = "3.1", features = ["sysvar", "wincode"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
